
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - PENIBON</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b1020;
color:white;
font-family:Arial,sans-serif
}

header{
background:#151d35;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center
}

header h2{color:#48d6c5;margin:0}

a{color:#48d6c5;text-decoration:none}

main{
max-width:650px;
margin:25px auto;
padding:15px
}

.card{
background:#151d35;
border:1px solid #293653;
border-radius:13px;
padding:15px;
margin:12px 0
}

.notification{
display:flex;
align-items:center;
gap:12px
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#293653;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
flex-shrink:0
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.details{flex:1;min-width:0}

.details p{
margin:5px 0;
line-height:1.4;
overflow-wrap:anywhere
}

.time{
color:#aab6ce;
font-size:12px;
margin-top:7px
}

.unread{
border-left:4px solid #48d6c5
}

.actions{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap
}

button{
border:0;
border-radius:8px;
padding:10px;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.read{
background:#293653;
color:white
}

.delete{
background:#a83245;
color:white
}

#message{
text-align:center;
color:#aab6ce;
padding:25px
}

#count{color:#48d6c5}

.live{
font-size:12px;
color:#48d6c5;
margin-top:5px
}
</style>
</head>

<body>

<header>
<h2>🔔 PENIBON</h2>
<a href="./dashboard.html">← Dashboard</a>
</header>

<main>

<h2>Notifications 🔔</h2>

<p id="count">Connecting...</p>
<div class="live">🟢 Live notifications enabled</div>

<div id="notifications"></div>

<div id="message">Please wait...</div>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
doc,
getDoc,
updateDoc,
deleteDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBjN2BDH1ol2ziowFQegJRnyZINCZhijHU",
authDomain: "penibon-b9f0f.firebaseapp.com",
projectId: "penibon-b9f0f",
storageBucket: "penibon-b9f0f.firebasestorage.app",
messagingSenderId: "770060676311",
appId: "1:770060676311:web:7b8ef4506e64465d1e1492"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let unsubscribeNotifications = null;
let renderVersion = 0;

const box = document.getElementById("notifications");
const message = document.getElementById("message");
const count = document.getElementById("count");

function formatDate(timestamp){

if(!timestamp || !timestamp.toDate){
return "Just now";
}

return timestamp.toDate().toLocaleString();

}

function showError(error){

console.error(error);

message.style.display = "block";
message.textContent =
"Could not load notifications: " + error.message;

}

async function renderNotifications(snapshot){

const version = ++renderVersion;

box.innerHTML = "";

const unread = snapshot.docs.filter(
item => item.data().read === false
).length;

count.textContent =
snapshot.size + " notifications • " +
unread + " unread";

if(snapshot.empty){

message.style.display = "block";
message.textContent =
"You have no notifications yet. 💙";

return;

}

message.style.display = "block";
message.textContent = "Updating notifications...";

const items = [...snapshot.docs].sort((a,b)=>{

const timeA = a.data().createdAt?.toMillis?.() || 0;
const timeB = b.data().createdAt?.toMillis?.() || 0;

return timeB-timeA;

});

try{

const renderedItems = await Promise.all(
items.map(async notificationDoc=>{

const data = notificationDoc.data();

let sender = {};

try{

const senderSnap = await getDoc(
doc(db,"publicProfiles",data.senderId)
);

if(senderSnap.exists()){
sender = senderSnap.data();
}

}catch(error){

console.error("Could not load sender profile:",error);

}

return {
notificationDoc,
data,
sender
};

})
);

if(version !== renderVersion)return;

box.innerHTML = "";

for(const item of renderedItems){

const notificationDoc = item.notificationDoc;
const data = item.data;
const sender = item.sender;

const name = sender.displayName || "PENIBON User";

const card = document.createElement("div");

card.className =
"card notification" +
(data.read ? "" : " unread");

const avatar = document.createElement("div");
avatar.className = "avatar";

if(sender.photoURL){

const img = document.createElement("img");
img.src = sender.photoURL;
img.alt = name;

img.onerror = ()=>{
avatar.textContent = "👤";
};

avatar.appendChild(img);

}else{

avatar.textContent = "👤";

}

const details = document.createElement("div");
details.className = "details";

const profileLink = document.createElement("a");

profileLink.href =
"./profile.html?uid=" +
encodeURIComponent(data.senderId);

profileLink.textContent = name;

const paragraph = document.createElement("p");

if(data.type === "follow"){

paragraph.append(profileLink);

paragraph.append(
document.createTextNode(" started following you. 🎉")
);

}else{

paragraph.textContent =
"You have a new notification.";

}

const time = document.createElement("div");
time.className = "time";
time.textContent = formatDate(data.createdAt);

details.append(paragraph,time);

const actions = document.createElement("div");
actions.className = "actions";

const readButton = document.createElement("button");

readButton.className = "read";

readButton.textContent =
data.read ? "Read ✓" : "Mark read";

readButton.disabled = data.read;

readButton.onclick = async()=>{

readButton.disabled = true;

try{

await updateDoc(
doc(db,"notifications",notificationDoc.id),
{read:true}
);

// Firebase automatically updates the page.

}catch(error){

readButton.disabled = false;

alert("Could not mark as read: " + error.message);

}

};

const deleteButton = document.createElement("button");

deleteButton.className = "delete";
deleteButton.textContent = "Delete";

deleteButton.onclick = async()=>{

if(!confirm("Delete this notification?"))return;

deleteButton.disabled = true;

try{

await deleteDoc(
doc(db,"notifications",notificationDoc.id)
);

// Firebase automatically removes it from the page.

}catch(error){

deleteButton.disabled = false;

alert("Could not delete notification: " + error.message);

}

};

actions.append(readButton,deleteButton);
details.appendChild(actions);

card.append(avatar,details);

box.appendChild(card);

}

if(version === renderVersion){

message.style.display = "none";

}

}catch(error){

if(version === renderVersion){
showError(error);
}

}

}

function startNotifications(user){

if(unsubscribeNotifications){

unsubscribeNotifications();
unsubscribeNotifications = null;

}

currentUser = user;

box.innerHTML = "";

message.style.display = "block";
message.textContent = "Connecting to live notifications...";

const q = query(
collection(db,"notifications"),
where("recipientId","==",user.uid)
);

unsubscribeNotifications = onSnapshot(
q,

snapshot=>{

renderNotifications(snapshot);

},

error=>{

showError(error);

}

);

}

onAuthStateChanged(auth,user=>{

if(!user){

if(unsubscribeNotifications){
unsubscribeNotifications();
unsubscribeNotifications = null;
}

window.location.href = "./account.html";
return;

}

startNotifications(user);

});

</script>

</body>
</html>
