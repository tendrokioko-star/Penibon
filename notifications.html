
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>Notifications - PENIBON</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b1020;
color:white;
font-family:Arial,sans-serif
}

header{
background:#151d35;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px
}

header h2{
color:#48d6c5;
margin:0
}

a{
color:#48d6c5;
text-decoration:none
}

main{
max-width:650px;
margin:25px auto;
padding:15px
}

.card{
background:#151d35;
border:1px solid #293653;
border-radius:13px;
padding:15px;
margin:12px 0
}

.notification{
display:flex;
align-items:flex-start;
gap:12px
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#293653;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
flex-shrink:0;
font-size:22px
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.details{
flex:1;
min-width:0
}

.details p{
margin:5px 0;
line-height:1.5;
overflow-wrap:anywhere
}

.time{
color:#aab6ce;
font-size:12px;
margin-top:7px
}

.unread{
border-left:4px solid #48d6c5
}

.actions{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap
}

button{
border:0;
border-radius:8px;
padding:10px;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.read{
background:#293653;
color:white
}

.delete{
background:#a83245;
color:white
}

#message{
text-align:center;
color:#aab6ce;
padding:25px;
line-height:1.5
}

#count{
color:#48d6c5
}

.live{
font-size:12px;
color:#48d6c5;
margin-top:5px
}

.activity{
background:#101a30;
padding:10px;
border-radius:9px;
margin-top:10px;
line-height:1.5;
overflow-wrap:anywhere;
font-size:14px
}

.video-title{
color:#48d6c5;
font-weight:bold;
margin-top:8px;
font-size:14px
}

@media(max-width:450px){
main{padding:10px}
.card{padding:12px}
}
</style>
</head>

<body>

<header>
<h2>🔔 PENIBON</h2>
<a href="./dashboard.html">← Dashboard</a>
</header>

<main>

<h2>Notifications 🔔</h2>

<p id="count">Connecting...</p>

<div class="live">🟢 Live notifications enabled</div>

<div id="notifications"></div>

<div id="message">Please wait...</div>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
doc,
getDoc,
updateDoc,
deleteDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBjN2BDH1ol2ziowFQegJRnyZINCZhijHU",
authDomain: "penibon-b9f0f.firebaseapp.com",
projectId: "penibon-b9f0f",
storageBucket: "penibon-b9f0f.firebasestorage.app",
messagingSenderId: "770060676311",
appId: "1:770060676311:web:7b8ef4506e64465d1e1492"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let unsubscribeNotifications = null;
let renderVersion = 0;

const box = document.getElementById("notifications");
const message = document.getElementById("message");
const count = document.getElementById("count");

// =====================================
// DATE
// =====================================

function formatDate(timestamp){

if(!timestamp || !timestamp.toDate){
return "Just now";
}

return timestamp.toDate().toLocaleString();

}

// =====================================
// SAFE ELEMENT CREATION
// =====================================

function makeElement(tag,className,text){

const el = document.createElement(tag);

if(className){
el.className = className;
}

if(text !== undefined){
el.textContent = text;
}

return el;

}

// =====================================
// ERROR
// =====================================

function showError(error){

console.error(error);

message.style.display = "block";

message.textContent =
"Could not load notifications: " + error.message;

}

// =====================================
// LOAD VIDEO INFORMATION
// =====================================

async function getVideoInformation(videoId){

if(!videoId){
return null;
}

try{

const videoSnap = await getDoc(
doc(db,"videos",videoId)
);

if(!videoSnap.exists()){
return null;
}

return videoSnap.data();

}catch(error){

console.error("Video information error:",error);

return null;

}

}

// =====================================
// LOAD COMMENT INFORMATION
// =====================================

async function getCommentInformation(commentId){

if(!commentId){
return null;
}

try{

const commentSnap = await getDoc(
doc(db,"comments",commentId)
);

if(!commentSnap.exists()){
return null;
}

return commentSnap.data();

}catch(error){

console.error("Comment information error:",error);

return null;

}

}

// =====================================
// LOAD SENDER PROFILE
// =====================================

async function getSenderInformation(senderId){

if(!senderId){
return {};
}

try{

const senderSnap = await getDoc(
doc(db,"publicProfiles",senderId)
);

if(senderSnap.exists()){
return senderSnap.data();
}

}catch(error){

console.error("Sender profile error:",error);

}

return {};

}

// =====================================
// BUILD NOTIFICATION CONTENT
// =====================================

async function getNotificationInformation(data){

const sender = await getSenderInformation(
data.senderId
);

let video = null;
let comment = null;

if(
data.type === "like" ||
data.type === "comment"
){

video = await getVideoInformation(
data.videoId
);

}

if(data.type === "comment"){

comment = await getCommentInformation(
data.commentId
);

}

return {
sender,
video,
comment
};

}

// =====================================
// RENDER NOTIFICATIONS
// =====================================

async function renderNotifications(snapshot){

const version = ++renderVersion;

box.replaceChildren();

const unread = snapshot.docs.filter(
item => item.data().read === false
).length;

count.textContent =
snapshot.size + " notifications • " +
unread + " unread";

if(snapshot.empty){

message.style.display = "block";

message.textContent =
"You have no notifications yet. 💙";

return;

}

message.style.display = "block";

message.textContent = "Updating notifications...";

const items = [...snapshot.docs].sort((a,b)=>{

const timeA =
a.data().createdAt?.toMillis?.() || 0;

const timeB =
b.data().createdAt?.toMillis?.() || 0;

return timeB-timeA;

});

try{

const renderedItems = await Promise.all(

items.map(async notificationDoc=>{

const data = notificationDoc.data();

const info = await getNotificationInformation(data);

return {
notificationDoc,
data,
sender:info.sender,
video:info.video,
comment:info.comment
};

})

);

if(version !== renderVersion)return;

box.replaceChildren();

for(const item of renderedItems){

const notificationDoc = item.notificationDoc;
const data = item.data;
const sender = item.sender;
const video = item.video;
const comment = item.comment;

const name =
sender.displayName || "PENIBON User";

// =====================================
// CARD
// =====================================

const card = makeElement(
"div",
"card notification" +
(data.read ? "" : " unread")
);

// =====================================
// AVATAR
// =====================================

const avatar = makeElement("div","avatar");

if(sender.photoURL){

const img = document.createElement("img");

img.src = sender.photoURL;
img.alt = name;

img.onerror = ()=>{
avatar.replaceChildren();
avatar.textContent = "👤";
};

avatar.appendChild(img);

}else{

avatar.textContent = "👤";

}

// =====================================
// DETAILS
// =====================================

const details = makeElement("div","details");

const profileLink = makeElement(
"a",
"",
name
);

profileLink.href =
"./profile.html?uid=" +
encodeURIComponent(data.senderId || "");

const paragraph = makeElement("p");

// FOLLOW NOTIFICATION

if(data.type === "follow"){

paragraph.append(profileLink);

paragraph.append(
document.createTextNode(
" started following you. 🎉"
)
);

// LIKE NOTIFICATION

}else if(data.type === "like"){

paragraph.append(profileLink);

paragraph.append(
document.createTextNode(
" liked your video. ❤️"
)
);

// COMMENT NOTIFICATION

}else if(data.type === "comment"){

paragraph.append(profileLink);

paragraph.append(
document.createTextNode(
" commented on your video. 💬"
)
);

// UNKNOWN NOTIFICATION

}else{

paragraph.append(profileLink);

paragraph.append(
document.createTextNode(
" sent you a notification. 🔔"
)
);

}

details.appendChild(paragraph);

// =====================================
// VIDEO DETAILS
// =====================================

if(
(data.type === "like" || data.type === "comment")
){

if(video && video.title){

const videoTitle = makeElement(
"div",
"video-title",
"🎬 " + video.title
);

details.appendChild(videoTitle);

}else{

details.appendChild(
makeElement(
"div",
"video-title",
"🎬 Your video"
)
);

}

}

// =====================================
// COMMENT TEXT
// =====================================

if(data.type === "comment"){

if(comment && comment.text){

const commentBox = makeElement(
"div",
"activity",
"💬 " + comment.text
);

details.appendChild(commentBox);

}else{

details.appendChild(
makeElement(
"div",
"activity",
"💬 A comment was added to your video."
)
);

}

}

// =====================================
// TIME
// =====================================

const time = makeElement(
"div",
"time",
formatDate(data.createdAt)
);

details.appendChild(time);

// =====================================
// ACTIONS
// =====================================

const actions = makeElement("div","actions");

const readButton = makeElement(
"button",
"read",
data.read ? "Read ✓" : "Mark read"
);

readButton.disabled = !!data.read;

readButton.onclick = async()=>{

readButton.disabled = true;

try{

await updateDoc(
doc(db,"notifications",notificationDoc.id),
{
read:true
}
);

}catch(error){

readButton.disabled = false;

alert(
"Could not mark as read: " +
error.message
);

}

};

// DELETE BUTTON

const deleteButton = makeElement(
"button",
"delete",
"Delete"
);

deleteButton.onclick = async()=>{

if(!confirm("Delete this notification?")){
return;
}

deleteButton.disabled = true;

try{

await deleteDoc(
doc(db,"notifications",notificationDoc.id)
);

}catch(error){

deleteButton.disabled = false;

alert(
"Could not delete notification: " +
error.message
);

}

};

actions.append(
readButton,
deleteButton
);

details.appendChild(actions);

card.append(
avatar,
details
);

box.appendChild(card);

}

if(version === renderVersion){

message.style.display = "none";

}

}catch(error){

if(version === renderVersion){
showError(error);
}

}

}

// =====================================
// START LIVE NOTIFICATIONS
// =====================================

function startNotifications(user){

if(unsubscribeNotifications){

unsubscribeNotifications();

unsubscribeNotifications = null;

}

currentUser = user;

box.replaceChildren();

message.style.display = "block";

message.textContent =
"Connecting to live notifications...";

const q = query(
collection(db,"notifications"),
where("recipientId","==",user.uid)
);

unsubscribeNotifications = onSnapshot(

q,

snapshot=>{

renderNotifications(snapshot);

},

error=>{

showError(error);

}

);

}

// =====================================
// AUTHENTICATION
// =====================================

onAuthStateChanged(auth,user=>{

if(!user){

if(unsubscribeNotifications){

unsubscribeNotifications();

unsubscribeNotifications = null;

}

window.location.href = "./account.html";

return;

}

startNotifications(user);

});

</script>

</body>
</html>
