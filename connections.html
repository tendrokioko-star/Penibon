
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections - PENIBON</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#171c32;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;color:#6ee7ff}
a{color:#6ee7ff;text-decoration:none}
main{max-width:650px;margin:25px auto;padding:15px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
button{border:0;border-radius:10px;padding:12px;background:#252d49;color:white;font-weight:bold;cursor:pointer}
button.active{background:#00bcd4;color:#07111c}
.person{background:#171c32;border:1px solid #303a5c;border-radius:14px;padding:15px;margin:12px 0;display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#293657;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.details{flex:1;min-width:0}
.details strong{display:block;margin-bottom:5px}
.details p{margin:0;color:#b8c2da;font-size:13px;overflow-wrap:anywhere}
.profile{display:inline-block;margin-top:7px;font-size:13px}
#message{color:#b8c2da;text-align:center;padding:25px}
</style>
</head>
<body>
<header>
<h2>💙 PENIBON</h2>
<a href="./dashboard.html">← Dashboard</a>
</header>

<main>
<h2>👥 My Connections</h2>
<p style="color:#aab5ce">Discover the people connected to you.</p>

<div class="tabs">
<button id="followersTab" class="active">Followers</button>
<button id="followingTab">Following</button>
</div>

<div id="count" style="color:#6ee7ff;margin-bottom:12px">Loading...</div>
<div id="people"></div>
<div id="message">Loading connections...</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,collection,query,where,getDocs,doc,getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBjN2BDH1ol2ziowFQegJRnyZINCZhijHU",
authDomain: "penibon-b9f0f.firebaseapp.com",
projectId: "penibon-b9f0f",
storageBucket: "penibon-b9f0f.firebasestorage.app",
messagingSenderId: "770060676311",
appId: "1:770060676311:web:7b8ef4506e64465d1e1492"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let activeTab="followers";

const peopleBox=document.getElementById("people");
const message=document.getElementById("message");
const count=document.getElementById("count");
const followersTab=document.getElementById("followersTab");
const followingTab=document.getElementById("followingTab");

followersTab.onclick=()=>{
activeTab="followers";
followersTab.classList.add("active");
followingTab.classList.remove("active");
loadConnections();
};

followingTab.onclick=()=>{
activeTab="following";
followingTab.classList.add("active");
followersTab.classList.remove("active");
loadConnections();
};

async function loadConnections(){
if(!currentUser)return;

peopleBox.innerHTML="";
message.textContent="Loading...";
message.style.display="block";
count.textContent="";

try{
const field=activeTab==="followers"?"followingId":"followerId";
const otherField=activeTab==="followers"?"followerId":"followingId";

const q=query(
collection(db,"follows"),
where(field,"==",currentUser.uid)
);

const snapshot=await getDocs(q);
count.textContent=snapshot.size+" "+activeTab;

if(snapshot.empty){
message.textContent=activeTab==="followers"
?"Nobody follows you yet."
:"You are not following anyone yet.";
return;
}

message.style.display="none";

for(const followDoc of snapshot.docs){
const otherId=followDoc.data()[otherField];
const profileSnap=await getDoc(doc(db,"publicProfiles",otherId));

if(!profileSnap.exists())continue;

const profile=profileSnap.data();
const name=profile.displayName||"PENIBON User";
const bio=profile.bio||"No bio yet";
const avatar=profile.photoURL
?`<img src="${escapeHTML(profile.photoURL)}" alt="">`
:"👤";

const card=document.createElement("div");
card.className="person";

const avatarBox=document.createElement("div");
avatarBox.className="avatar";
if(profile.photoURL){
const img=document.createElement("img");
img.src=profile.photoURL;
img.alt="";
avatarBox.appendChild(img);
}else{
avatarBox.textContent="👤";
}

const details=document.createElement("div");
details.className="details";

const strong=document.createElement("strong");
strong.textContent=name;

const paragraph=document.createElement("p");
paragraph.textContent=bio;

const link=document.createElement("a");
link.className="profile";
link.href="./people.html";
link.textContent="Find people →";

details.append(strong,paragraph,link);
card.append(avatarBox,details);
peopleBox.appendChild(card);
}
}catch(error){
console.error(error);
message.textContent="Could not load connections. Please refresh and try again.";
}
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[char]));
}

onAuthStateChanged(auth,user=>{
if(!user){
window.location.href="./account.html";
return;
}
currentUser=user;
loadConnections();
});
</script>
</body>
</html>
