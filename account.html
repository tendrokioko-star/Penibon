
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENIBON | Account</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#080d25,#172b55);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.container{
  width:100%;
  max-width:420px;
  background:#111b35;
  padding:28px;
  border-radius:18px;
  box-shadow:0 8px 30px #0006;
}
.logo{text-align:center;font-size:32px;font-weight:bold;color:#42d6ff}
.tagline{text-align:center;color:#b7c8df;margin-bottom:25px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{
  flex:1;padding:12px;border:0;border-radius:8px;
  background:#263858;color:white;font-weight:bold;
}
.tabs button.active{background:#168bd2}
h2{text-align:center;margin-top:5px}
input{
  width:100%;padding:14px;margin:9px 0;
  border:1px solid #405578;border-radius:8px;
  background:#091329;color:white;font-size:15px;
}
.action{
  width:100%;padding:14px;margin-top:12px;
  background:#168bd2;color:white;border:0;
  border-radius:8px;font-size:16px;font-weight:bold;
}
.action:disabled{opacity:.6}
.forgot{text-align:center;margin-top:17px}
.forgot button{
  color:#42d6ff;background:none;border:0;
  font-size:14px;
}
#message{text-align:center;margin-top:15px;color:#ffd166}
.small{text-align:center;color:#aebdd3;font-size:13px;margin-top:20px}
.hidden{display:none}
</style>
</head>
<body>

<div class="container">
  <div class="logo">PENIBON</div>
  <div class="tagline">WATCH • PLAY • DISCOVER</div>

  <div class="tabs">
    <button id="loginTab" class="active">Login</button>
    <button id="registerTab">Register</button>
  </div>

  <h2 id="heading">Welcome Back</h2>

  <form id="accountForm">
    <input id="name" type="text" placeholder="Your full name" class="hidden">

    <input id="email" type="email" placeholder="Email address" required>

    <input id="password" type="password"
      placeholder="Password" required minlength="6">

    <button class="action" id="submitButton" type="submit">
      Login
    </button>
  </form>

  <div class="forgot" id="forgotArea">
    <button id="forgotButton" type="button">Forgot password?</button>
  </div>

  <p id="message"></p>

  <div class="small">
    Your entertainment. Your community. Your world.
  </div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjN2BDH1ol2ziowFQegJRnyZINCZhijHU",
  authDomain: "penibon-b9f0f.firebaseapp.com",
  projectId: "penibon-b9f0f",
  storageBucket: "penibon-b9f0f.firebasestorage.app",
  messagingSenderId: "770060676311",
  appId: "1:770060676311:web:7b8ef4506e64465d1e1492"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const heading = document.getElementById("heading");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");
const forgotArea = document.getElementById("forgotArea");
const accountForm = document.getElementById("accountForm");

let mode = "login";

function showMessage(text) {
  message.textContent = text;
}

function setMode(newMode) {
  mode = newMode;
  showMessage("");

  if (mode === "register") {
    heading.textContent = "Create Your Account";
    nameInput.classList.remove("hidden");
    nameInput.required = true;
    submitButton.textContent = "Create Account";
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    forgotArea.classList.add("hidden");
  } else {
    heading.textContent = "Welcome Back";
    nameInput.classList.add("hidden");
    nameInput.required = false;
    submitButton.textContent = "Login";
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    forgotArea.classList.remove("hidden");
  }
}

loginTab.addEventListener("click", () => setMode("login"));
registerTab.addEventListener("click", () => setMode("register"));

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("index.html");
  }
});

accountForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  submitButton.disabled = true;
  showMessage("Please wait...");

  try {
    if (mode === "register") {
      const fullName = nameInput.value.trim();

      if (!fullName) {
        throw new Error("Please enter your name.");
      }

      const result = await createUserWithEmailAndPassword(
        auth, email, password
      );

      await updateProfile(result.user, {
        displayName: fullName
      });

      showMessage("Account created successfully. Opening PENIBON...");

    } else {
      await signInWithEmailAndPassword(auth, email, password);
      showMessage("Login successful. Opening PENIBON...");
    }

    window.location.replace("index.html");

  } catch (error) {
    let errorText = error.message;

    if (error.code === "auth/email-already-in-use") {
      errorText = "This email already has an account. Please log in.";
    } else if (error.code === "auth/invalid-credential") {
      errorText = "Incorrect email or password.";
    } else if (error.code === "auth/weak-password") {
      errorText = "Please use a stronger password.";
    } else if (error.code === "auth/invalid-email") {
      errorText = "Please enter a valid email address.";
    }

    showMessage(errorText);
  } finally {
    submitButton.disabled = false;
  }
});

document.getElementById("forgotButton").addEventListener("click",
async () => {
  const email = emailInput.value.trim();

  if (!email) {
    showMessage("Enter your email address first.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("Password reset email sent. Check your inbox.");
  } catch (error) {
    showMessage("Unable to send reset email. Check your email address.");
  }
});
</script>

</body>
</html>
