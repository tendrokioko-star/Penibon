
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>PENIBON Videos</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  background:#151d35;
  padding:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#42e8c5;
}

nav{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

nav a{
  color:white;
  text-decoration:none;
}

main{
  max-width:850px;
  margin:auto;
  padding:20px 14px;
}

h1,h2{color:#42e8c5}

.intro{
  color:#bdc8df;
  line-height:1.6;
}

.video-card{
  background:#18213a;
  border:1px solid #293653;
  border-radius:14px;
  padding:15px;
  margin:20px 0;
}

.video-player{
  width:100%;
  max-height:480px;
  background:#050814;
  border-radius:10px;
  display:block;
}

.creator{
  color:#42e8c5;
  font-weight:bold;
  margin-top:13px;
}

.video-title{
  font-size:19px;
  font-weight:bold;
  margin:12px 0 7px;
}

.description{
  color:#d0d8e8;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.category{
  display:inline-block;
  background:#263550;
  color:#42e8c5;
  padding:6px 11px;
  border-radius:20px;
  font-size:12px;
  margin-top:8px;
}

.date{
  color:#9eabc5;
  font-size:12px;
  margin-top:10px;
}

.message{
  background:#18213a;
  padding:20px;
  border-radius:12px;
  text-align:center;
  color:#bdc8df;
  line-height:1.6;
}

.creator-link{
  color:#42e8c5;
  text-decoration:none;
}

footer{
  text-align:center;
  padding:25px;
  color:#aeb8d0;
  background:#151d35;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PENIBON</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="videos.html">Videos</a>
    <a href="creator.html">Creator Studio</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>
</header>

<main>

  <h1>🎬 PENIBON Videos</h1>

  <p class="intro">
    Discover videos shared by PENIBON creators.
    Watch, enjoy and discover new creativity.
  </p>

  <div id="videoFeed">
    <div class="message">Loading PENIBON videos...</div>
  </div>

</main>

<footer>
  © 2026 PENIBON. WATCH • PLAY • DISCOVER
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot,
  getDocs,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyBjN2BDH1ol2ziowFQegJRnyZINCZhijHU",
  authDomain: "penibon-b9f0f.firebaseapp.com",
  projectId: "penibon-b9f0f",
  storageBucket: "penibon-b9f0f.firebasestorage.app",
  messagingSenderId: "770060676311",
  appId: "1:770060676311:web:7b8ef4506e64465d1e1492"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const feed = document.getElementById("videoFeed");

function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = text;
  return element;
}

function formatDate(timestamp) {
  if (!timestamp || !timestamp.toDate) return "";

  return timestamp.toDate().toLocaleString();
}

async function displayVideos(snapshot) {

  feed.replaceChildren();

  if (snapshot.empty) {
    feed.appendChild(
      makeElement(
        "div",
        "message",
        "No videos have been published yet. Be the first PENIBON creator!"
      )
    );
    return;
  }

  const videos = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  // Load creator profiles
  const creatorIds = [
    ...new Set(videos.map(video => video.creatorId).filter(Boolean))
  ];

  const profileResults = await Promise.all(
    creatorIds.map(async uid => {
      try {
        const result = await getDocs(
          query(
            collection(db, "publicProfiles")
          )
        );

        const profile = result.docs.find(
          item => item.id === uid
        );

        return [
          uid,
          profile ? profile.data() : null
        ];

      } catch (error) {
        console.error("Profile loading error:", error);
        return [uid, null];
      }
    })
  );

  const profiles = new Map(profileResults);

  for (const video of videos) {

    // Accept only Cloudinary HTTPS video links
    let videoUrl;

    try {
      videoUrl = new URL(video.videoUrl);

      if (
        videoUrl.protocol !== "https:" ||
        videoUrl.hostname !== "res.cloudinary.com"
      ) {
        continue;
      }

    } catch {
      continue;
    }

    const profile = profiles.get(video.creatorId);

    const creatorName =
      profile?.displayName || "PENIBON Creator";

    const card = document.createElement("article");
    card.className = "video-card";

    const player = document.createElement("video");
    player.className = "video-player";
    player.src = videoUrl.href;
    player.controls = true;
    player.playsInline = true;
    player.preload = "metadata";

    const creator = document.createElement("div");
    creator.className = "creator";

    const creatorLink = document.createElement("a");
    creatorLink.className = "creator-link";
    creatorLink.href =
      "profile.html?uid=" +
      encodeURIComponent(video.creatorId);

    creatorLink.textContent = "👤 " + creatorName;

    creator.appendChild(creatorLink);

    const title = makeElement(
      "div",
      "video-title",
      video.title || "Untitled video"
    );

    const description = makeElement(
      "div",
      "description",
      video.description || ""
    );

    const category = makeElement(
      "span",
      "category",
      video.category || "Other"
    );

    const date = makeElement(
      "div",
      "date",
      formatDate(video.createdAt)
    );

    card.appendChild(player);
    card.appendChild(creator);
    card.appendChild(title);
    card.appendChild(description);
    card.appendChild(category);
    card.appendChild(date);

    feed.appendChild(card);
  }

  if (!feed.children.length) {
    feed.appendChild(
      makeElement(
        "div",
        "message",
        "No playable videos are available yet."
      )
    );
  }
}

// Listen for new videos in real time

const videosQuery = query(
  collection(db, "videos"),
  orderBy("createdAt", "desc"),
  limit(50)
);

onSnapshot(
  videosQuery,
  snapshot => {
    displayVideos(snapshot).catch(error => {
      console.error(error);
      feed.replaceChildren(
        makeElement(
          "div",
          "message",
          "Unable to display videos. Please refresh and try again."
        )
      );
    });
  },
  error => {
    console.error(error);

    feed.replaceChildren(
      makeElement(
        "div",
        "message",
        "Could not load videos: " + error.message
      )
    );
  }
);

</script>

</body>
</html>
