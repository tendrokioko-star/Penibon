
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PENIBON Camera Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#studio {
    position: relative;
    width: 100%;
    height: 100dvh;
    background: #111;
    overflow: hidden;
}

#cameraCanvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#sourceCamera {
    display: none;
}

.topbar {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
}

.top-button {
    background: rgba(0,0,0,.55);
    border: 0;
    color: white;
    padding: 12px;
    border-radius: 25px;
    font-size: 16px;
}

.brand {
    font-weight: bold;
    color: #48d6c5;
    font-size: 18px;
}

.side-tools {
    position: absolute;
    right: 8px;
    top: 75px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    z-index: 5;
}

.tool {
    border: none;
    background: transparent;
    color: white;
    text-align: center;
    font-size: 12px;
    text-shadow: 1px 2px 3px black;
    min-width: 55px;
    padding: 4px;
}

.tool .symbol {
    display: block;
    font-size: 27px;
    margin-bottom: 3px;
}

.tool.active {
    color: #48d6c5;
}

.bottom-area {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    padding: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    z-index: 5;
}

.mode-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
    align-items: center;
}

.mode {
    border: none;
    background: transparent;
    color: white;
    font-size: 15px;
    padding: 8px;
}

.mode.active {
    background: white;
    color: black;
    border-radius: 20px;
    font-weight: bold;
}

.capture-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.capture-button {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: white;
    border: 5px solid #aaa;
    outline: 2px solid white;
}

.capture-button.recording {
    background: #ef334b;
    border-radius: 20px;
    transform: scale(.8);
}

.bottom-tool {
    border: 0;
    background: transparent;
    color: white;
    font-size: 13px;
    text-align: center;
    min-width: 70px;
}

.bottom-tool span {
    display: block;
    font-size: 25px;
    margin-bottom: 5px;
}

#status {
    text-align: center;
    font-size: 12px;
    margin-top: 12px;
    text-shadow: 1px 1px 3px black;
}

#filterPanel {
    position: absolute;
    bottom: 150px;
    left: 10px;
    right: 10px;
    z-index: 8;
    background: rgba(15,20,35,.96);
    padding: 14px;
    border-radius: 15px;
    display: none;
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 8px;
}

.filter-option {
    padding: 11px 4px;
    background: #303b52;
    color: white;
    border: 1px solid transparent;
    border-radius: 9px;
    font-size: 12px;
}

.filter-option.active {
    border-color: #48d6c5;
    color: #48d6c5;
}

#musicPanel {
    position: absolute;
    top: 65px;
    left: 12px;
    right: 12px;
    background: rgba(15,20,35,.97);
    border-radius: 15px;
    padding: 15px;
    z-index: 10;
    display: none;
}

#musicPanel input {
    width: 100%;
    color: white;
    margin-top: 12px;
}

.panel-button {
    background: #48d6c5;
    color: black;
    border: none;
    border-radius: 9px;
    padding: 10px;
    margin-top: 10px;
    width: 100%;
    font-weight: bold;
}

#resultPanel {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
    background: #080d1b;
    padding: 18px;
    overflow-y: auto;
    text-align: center;
}

#resultPanel video,
#resultImage {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
    background: black;
    border-radius: 12px;
}

#resultImage {
    display: none;
}

.result-button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 9px;
    background: #48d6c5;
    color: black;
    font-weight: bold;
}

.secondary {
    background: #303b52;
    color: white;
}

input[type=file] {
    display: none;
}

@media (max-height: 700px) {
    .side-tools {
        gap: 5px;
        top: 65px;
    }
    .tool .symbol {
        font-size: 22px;
    }
    .bottom-area {
        bottom: 5px;
    }
}
</style>
</head>

<body>

<div id="studio">

<video id="sourceCamera" autoplay muted playsinline></video>
<canvas id="cameraCanvas" width="720" height="1280"></canvas>

<div class="topbar">
    <button class="top-button" onclick="goBack()">✕</button>
    <span class="brand">PENIBON</span>
    <button class="top-button" id="soundsButton">♫ Sounds</button>
</div>

<div class="side-tools">

    <button class="tool" id="flipButton">
        <span class="symbol">🔄</span>Flip
    </button>

    <button class="tool" id="flashButton">
        <span class="symbol">⚡</span>Flash
    </button>

    <button class="tool" id="timerButton">
        <span class="symbol">⏱</span>Timer: Off
    </button>

    <button class="tool" id="filtersButton">
        <span class="symbol">◉</span>Filters
    </button>

    <button class="tool" id="beautyButton">
        <span class="symbol">✨</span>Beautify
    </button>

    <button class="tool" id="greenButton">
        <span class="symbol">▧</span>Green Screen
    </button>

    <button class="tool" id="speedButton">
        <span class="symbol">1x</span>Speed
    </button>

    <button class="tool active" id="micButton">
        <span class="symbol">🎙</span>Mic On
    </button>

</div>

<div id="filterPanel">
    <h3>Camera Filters</h3>
    <div class="filter-grid">
        <button class="filter-option active" data-filter="none">Original</button>
        <button class="filter-option" data-filter="warm">Warm</button>
        <button class="filter-option" data-filter="cool">Cool</button>
        <button class="filter-option" data-filter="bw">B&W</button>
        <button class="filter-option" data-filter="vintage">Vintage</button>
        <button class="filter-option" data-filter="pink">Pink</button>
        <button class="filter-option" data-filter="bright">Bright</button>
        <button class="filter-option" data-filter="dreamy">Dreamy</button>
    </div>
    <button class="panel-button" id="closeFilters">Done</button>
</div>

<div id="musicPanel">
    <h3>♫ Add Sounds</h3>
    <p id="musicName">Choose music from your phone.</p>
    <input type="file" id="musicInput" accept="audio/*">
    <button class="panel-button" id="chooseMusic">Choose Music</button>
    <label>Music volume</label>
    <input type="range" id="musicVolume" min="0" max="100" value="50">
    <button class="panel-button" id="closeMusic">Done</button>
</div>

<div class="bottom-area">

    <div class="mode-row">
        <button class="mode" data-mode="video" data-length="180">3m</button>
        <button class="mode" data-mode="video" data-length="60">60s</button>
        <button class="mode active" data-mode="video" data-length="15">15s</button>
        <button class="mode" data-mode="photo">Photo</button>
    </div>

    <div class="capture-row">

        <button class="bottom-tool" id="effectsButton">
            <span>✨</span>Effects
        </button>

        <button class="capture-button" id="captureButton"></button>

        <button class="bottom-tool" id="uploadButton">
            <span>🖼️</span>Upload
        </button>

    </div>

    <p id="status">Open your camera to begin.</p>

</div>

<div id="resultPanel">
    <h2 style="color:#48d6c5">Your PENIBON Video</h2>

    <video id="resultVideo" controls playsinline></video>
    <img id="resultImage" alt="Your photo">

    <button class="result-button" id="downloadButton">
        Download
    </button>

    <button class="result-button secondary" id="retakeButton">
        Retake
    </button>

    <button class="result-button secondary" id="closeResult">
        Back to Camera
    </button>
</div>

<input type="file" id="uploadInput" accept="video/*,image/*">

</div>

<audio id="musicPlayer" loop></audio>

<script>
const source = document.getElementById("sourceCamera");
const canvas = document.getElementById("cameraCanvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const captureButton = document.getElementById("captureButton");

const musicPlayer = document.getElementById("musicPlayer");

const resultPanel = document.getElementById("resultPanel");
const resultVideo = document.getElementById("resultVideo");
const resultImage = document.getElementById("resultImage");

let stream = null;
let recorder = null;
let chunks = [];
let videoURL = null;
let photoURL = null;
let musicURL = null;

let facingMode = "user";
let selectedFilter = "none";
let selectedMode = "video";
let selectedLength = 15;
let timerSeconds = 0;
let micEnabled = true;
let flashEnabled = false;
let recording = false;
let animationId = null;
let audioContext = null;
let audioDestination = null;
let musicGain = null;
let musicSource = null;
let microphoneSource = null;
let recordingStream = null;
let beauty = false;
let effect = "none";

const filterValues = {
    none: "none",
    warm: "sepia(.25) saturate(1.3)",
    cool: "hue-rotate(12deg) saturate(.9)",
    bw: "grayscale(1) contrast(1.1)",
    vintage: "sepia(.45) contrast(.9)",
    pink: "sepia(.15) hue-rotate(300deg) saturate(1.3)",
    bright: "brightness(1.2) saturate(1.2)",
    dreamy: "brightness(1.12) saturate(1.1)"
};

function say(message) {
    statusText.textContent = message;
}

async function openCamera() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Open PENIBON in Chrome to use the camera.");
        }

        if (recording) return;

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        if (animationId) cancelAnimationFrame(animationId);

        stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: {
                facingMode: { ideal: facingMode },
                width: { ideal: 720 },
                height: { ideal: 1280 }
            }
        });

        source.srcObject = stream;
        await source.play();

        const micTrack = stream.getAudioTracks()[0];
        if (micTrack) micTrack.enabled = micEnabled;

        say("Camera ready. Start creating!");
        drawFrame();

    } catch (error) {
        say("Camera error: " + error.message);
    }
}

function drawFrame() {
    if (source.readyState >= 2 && source.videoWidth) {
        const w = canvas.width;
        const h = canvas.height;

        const scale = Math.max(
            w / source.videoWidth,
            h / source.videoHeight
        );

        const dw = source.videoWidth * scale;
        const dh = source.videoHeight * scale;

        const x = (w - dw) / 2;
        const y = (h - dh) / 2;

        ctx.save();
        ctx.clearRect(0, 0, w, h);
        ctx.filter = filterValues[selectedFilter];

        if (facingMode === "user") {
            ctx.translate(w, 0);
            ctx.scale(-1, 1);
        }

        ctx.drawImage(source, x, y, dw, dh);
        ctx.restore();

        if (beauty) {
            ctx.save();
            ctx.fillStyle = "rgba(255,190,205,.10)";
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }

        if (effect === "hearts") {
            ctx.font = "55px Arial";
            ctx.fillText("💖", 90, 200);
            ctx.fillText("❤️", 570, 360);
            ctx.fillText("💕", 140, 650);
        }

        if (effect === "glasses") {
            ctx.font = "100px Arial";
            ctx.fillText("🕶️", 360, 570);
        }

        if (effect === "stars") {
            ctx.font = "45px Arial";
            ctx.fillText("✨", 100, 350);
            ctx.fillText("✨", 590, 600);
            ctx.fillText("⭐", 350, 230);
        }
    }

    animationId = requestAnimationFrame(drawFrame);
}

document.getElementById("flipButton").onclick = async () => {
    if (recording) return;
    facingMode = facingMode === "user" ? "environment" : "user";
    await openCamera();
};

document.getElementById("flashButton").onclick = async () => {
    if (!stream) {
        say("Open the camera first.");
        return;
    }

    const track = stream.getVideoTracks()[0];

    try {
        if (!track.getCapabilities().torch) {
            say("Flash is not supported by this camera.");
            return;
        }

        flashEnabled = !flashEnabled;

        await track.applyConstraints({
            advanced: [{ torch: flashEnabled }]
        });

        document.getElementById("flashButton").classList.toggle("active", flashEnabled);
        say(flashEnabled ? "Flash on" : "Flash off");

    } catch (error) {
        say("Flash could not be changed on this device.");
    }
};

document.getElementById("timerButton").onclick = () => {
    timerSeconds = timerSeconds === 0 ? 3 :
                   timerSeconds === 3 ? 10 : 0;

    document.getElementById("timerButton").innerHTML =
        '<span class="symbol">⏱</span>Timer: ' +
        (timerSeconds ? timerSeconds + "s" : "Off");
};

document.getElementById("filtersButton").onclick = () => {
    const panel = document.getElementById("filterPanel");
    panel.style.display =
        panel.style.display === "block" ? "none" : "block";
};

document.getElementById("closeFilters").onclick = () => {
    document.getElementById("filterPanel").style.display = "none";
};

document.querySelectorAll(".filter-option").forEach(button => {
    button.onclick = () => {
        if (recording) return;

        selectedFilter = button.dataset.filter;

        document.querySelectorAll(".filter-option").forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");
        say("Filter: " + selectedFilter);
    };
});

document.getElementById("beautyButton").onclick = () => {
    beauty = !beauty;
    document.getElementById("beautyButton").classList.toggle("active", beauty);
    say(beauty ? "Beauty preview enabled." : "Beauty preview disabled.");
};

document.getElementById("greenButton").onclick = () => {
    say("Green Screen background replacement is coming in a later upgrade.");
};

document.getElementById("speedButton").onclick = () => {
    say("Recording speed controls are coming in a later upgrade.");
};

document.getElementById("micButton").onclick = () => {
    micEnabled = !micEnabled;

    if (stream) {
        stream.getAudioTracks().forEach(track => {
            track.enabled = micEnabled;
        });
    }

    document.getElementById("micButton").innerHTML =
        '<span class="symbol">🎙</span>' +
        (micEnabled ? "Mic On" : "Mic Off");

    say(micEnabled ? "Microphone enabled." : "Microphone muted.");
};

document.getElementById("soundsButton").onclick = () => {
    document.getElementById("musicPanel").style.display = "block";
};

document.getElementById("chooseMusic").onclick = () => {
    document.getElementById("musicInput").click();
};

document.getElementById("closeMusic").onclick = () => {
    document.getElementById("musicPanel").style.display = "none";
};

document.getElementById("musicInput").onchange = event => {
    const file = event.target.files[0];
    if (!file) return;

    if (musicURL) URL.revokeObjectURL(musicURL);

    musicURL = URL.createObjectURL(file);
    musicPlayer.src = musicURL;

    document.getElementById("musicName").textContent = file.name;
    say("Music selected: " + file.name);
};

document.getElementById("musicVolume").oninput = event => {
    if (musicGain) {
        musicGain.gain.value = Number(event.target.value) / 100;
    }
};

document.getElementById("effectsButton").onclick = () => {
    const choices = ["none", "hearts", "stars", "glasses"];
    const current = choices.indexOf(effect);
    effect = choices[(current + 1) % choices.length];

    say("Effect: " + effect);
};

document.querySelectorAll(".mode").forEach(button => {
    button.onclick = () => {
        document.querySelectorAll(".mode").forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");

        selectedMode = button.dataset.mode;

        if (selectedMode === "video") {
            selectedLength = Number(button.dataset.length);
            say("Video recording: " + selectedLength + " seconds.");
        } else {
            say("Photo mode selected.");
        }
    };
});

async function prepareAudio() {
    if (!audioContext) {
        audioContext = new AudioContext();
        audioDestination = audioContext.createMediaStreamDestination();

        musicGain = audioContext.createGain();
        musicGain.gain.value =
            Number(document.getElementById("musicVolume").value) / 100;

        musicGain.connect(audioDestination);

        musicSource = audioContext.createMediaElementSource(musicPlayer);
        musicSource.connect(musicGain);
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    if (microphoneSource) {
        microphoneSource.disconnect();
        microphoneSource = null;
    }

    if (micEnabled && stream.getAudioTracks().length) {
        microphoneSource =
            audioContext.createMediaStreamSource(
                new MediaStream(stream.getAudioTracks())
            );

        microphoneSource.connect(audioDestination);
    }

    return audioDestination.stream;
}

async function startRecording() {
    if (!stream) {
        await openCamera();
        if (!stream) return;
    }

    if (timerSeconds > 0) {
        let remaining = timerSeconds;

        while (remaining > 0) {
            say("Recording starts in " + remaining + "...");
            await new Promise(resolve => setTimeout(resolve, 1000));
            remaining--;
        }
    }

    try {
        const audioStream = await prepareAudio();
        const videoStream = canvas.captureStream(30);

        recordingStream = videoStream;

        audioStream.getAudioTracks().forEach(track => {
            recordingStream.addTrack(track);
        });

        chunks = [];

        const mimeTypes = [
            "video/webm;codecs=vp9,opus",
            "video/webm;codecs=vp8,opus",
            "video/webm"
        ];

        const supported = mimeTypes.find(type =>
            MediaRecorder.isTypeSupported(type)
        );

        recorder = supported
            ? new MediaRecorder(recordingStream, { mimeType: supported })
            : new MediaRecorder(recordingStream);

        recorder.ondataavailable = event => {
            if (event.data && event.data.size) {
                chunks.push(event.data);
            }
        };

        recorder.onstop = () => {
            const blob = new Blob(chunks, {
                type: recorder.mimeType || "video/webm"
            });

            if (videoURL) URL.revokeObjectURL(videoURL);

            videoURL = URL.createObjectURL(blob);
            resultVideo.src = videoURL;

            resultVideo.style.display = "block";
            resultImage.style.display = "none";

            resultPanel.style.display = "block";

            musicPlayer.pause();

            if (recordingStream) {
                recordingStream.getTracks().forEach(track => track.stop());
                recordingStream = null;
            }

            if (microphoneSource) {
                microphoneSource.disconnect();
                microphoneSource = null;
            }
        };

        recorder.start();
        recording = true;

        if (musicURL) {
            musicPlayer.currentTime = 0;
            musicPlayer.volume = 1;
            await musicPlayer.play().catch(() => {});
        }

        captureButton.classList.add("recording");
        say("🔴 Recording...");

        setTimeout(() => {
            if (recording && recorder.state === "recording") {
                stopRecording();
            }
        }, selectedLength * 1000);

    } catch (error) {
        say("Recording error: " + error.message);
    }
}

function stopRecording() {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }

    recording = false;
    captureButton.classList.remove("recording");
    musicPlayer.pause();
    say("Recording finished.");
}

captureButton.onclick = async () => {
    if (recording) {
        stopRecording();
        return;
    }

    if (selectedMode === "photo") {
        if (!stream) {
            await openCamera();
            if (!stream) return;
        }

        if (timerSeconds > 0) {
            let remaining = timerSeconds;

            while (remaining > 0) {
                say("Photo in " + remaining + "...");
                await new Promise(resolve => setTimeout(resolve, 1000));
                remaining--;
            }
        }

        canvas.toBlob(blob => {
            if (!blob) return;

            if (photoURL) URL.revokeObjectURL(photoURL);

            photoURL = URL.createObjectURL(blob);
            resultImage.src = photoURL;

            resultImage.style.display = "block";
            resultVideo.style.display = "none";

            resultPanel.style.display = "block";
        }, "image/jpeg", .92);

    } else {
        await startRecording();
    }
};

document.getElementById("downloadButton").onclick = () => {
    const link = document.createElement("a");

    if (resultVideo.style.display !== "none" && videoURL) {
        link.href = videoURL;
        link.download = "PENIBON-video.webm";
    } else if (photoURL) {
        link.href = photoURL;
        link.download = "PENIBON-photo.jpg";
    } else {
        return;
    }

    link.click();
};

document.getElementById("retakeButton").onclick = () => {
    resultVideo.pause();
    resultPanel.style.display = "none";

    if (videoURL) URL.revokeObjectURL(videoURL);
    if (photoURL) URL.revokeObjectURL(photoURL);

    videoURL = null;
    photoURL = null;

    say("Ready for another creation.");
};

document.getElementById("closeResult").onclick = () => {
    resultVideo.pause();
    resultPanel.style.display = "none";
};

document.getElementById("uploadButton").onclick = () => {
    document.getElementById("uploadInput").click();
};

document.getElementById("uploadInput").onchange = event => {
    const file = event.target.files[0];
    if (!file) return;

    if (file.type.startsWith("video/")) {
        if (videoURL) URL.revokeObjectURL(videoURL);

        videoURL = URL.createObjectURL(file);
        resultVideo.src = videoURL;
        resultVideo.style.display = "block";
        resultImage.style.display = "none";
    } else if (file.type.startsWith("image/")) {
        if (photoURL) URL.revokeObjectURL(photoURL);

        photoURL = URL.createObjectURL(file);
        resultImage.src = photoURL;
        resultImage.style.display = "block";
        resultVideo.style.display = "none";
    } else {
        say("Please choose a photo or video.");
        return;
    }

    resultPanel.style.display = "block";
    say("Media selected successfully.");
};

function goBack() {
    if (recording) stopRecording();

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    window.location.href = "dashboard.html";
}

window.addEventListener("pagehide", () => {
    if (animationId) cancelAnimationFrame(animationId);

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    if (recordingStream) {
        recordingStream.getTracks().forEach(track => track.stop());
    }

    musicPlayer.pause();

    if (audioContext) audioContext.close();
});
</script>

</body>
</html>
