
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PENIBON Camera Studio</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial;overflow:hidden}
#studio{height:100dvh;position:relative;background:#080808;overflow:hidden}
#cam{display:none}
#screen{width:100%;height:100%;display:block;object-fit:cover}
.top{position:absolute;top:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.top button,.tool,.bottom button{border:0;color:white;background:rgba(0,0,0,.55);border-radius:22px;padding:10px}
.brand{font-weight:bold;color:#48d6c5;font-size:19px}
.side{position:absolute;right:7px;top:75px;display:flex;flex-direction:column;gap:8px;z-index:4}
.tool{background:rgba(0,0,0,.5);font-size:11px;min-width:58px;padding:6px 3px}
.tool span{display:block;font-size:23px;margin-bottom:3px}
.tool.active{color:#48d6c5}
.bottom{position:absolute;bottom:12px;left:0;right:0;z-index:4;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:12px}
.modes{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.mode{background:transparent!important;padding:9px 12px!important}
.mode.active{background:white!important;color:black!important}
.capture{display:flex;justify-content:space-around;align-items:center}
#record{height:76px;width:76px;border-radius:50%;background:white;border:5px solid #aaa;outline:2px solid white}
#record.recording{background:#ed304d;border-radius:20px;transform:scale(.8)}
#status{text-align:center;font-size:12px;text-shadow:1px 1px 3px black;margin:12px 0 0}
.panel{display:none;position:absolute;z-index:8;left:10px;right:10px;bottom:155px;background:rgba(12,18,34,.97);padding:14px;border-radius:15px;max-height:45vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice,.action{background:#303b52;color:white;border:1px solid transparent;padding:12px 5px;border-radius:9px;font-size:12px}
.choice.active{border-color:#48d6c5;color:#48d6c5}
.action{background:#48d6c5;color:#07131c;width:100%;margin-top:10px;font-weight:bold}
.panel input{width:100%;margin:10px 0}
#result{display:none;position:absolute;inset:0;background:#080d1b;z-index:15;padding:18px;overflow:auto;text-align:center}
#result video,#result img{width:100%;max-height:65vh;object-fit:contain;background:#000;border-radius:12px}
.resultBtn{width:100%;padding:14px;border:0;border-radius:9px;margin-top:10px;background:#48d6c5;font-weight:bold}
.secondary{background:#303b52;color:white}
#musicName{font-size:12px;color:#b9c8db}
</style>
</head>

<body>
<div id="studio">
<video id="cam" autoplay muted playsinline></video>
<canvas id="screen" width="720" height="1280"></canvas>

<div class="top">
<button onclick="leave()">✕</button>
<span class="brand">PENIBON</span>
<button id="soundBtn">♫ Sounds</button>
</div>

<div class="side">
<button class="tool" id="flip"><span>🔄</span>Flip</button>
<button class="tool" id="timer"><span>⏱</span>Timer Off</button>
<button class="tool" id="filterBtn"><span>◉</span>Filters</button>
<button class="tool" id="beauty"><span>✨</span>Beauty</button>
<button class="tool" id="effectBtn"><span>🎭</span>Effects</button>
<button class="tool" id="green"><span>🟩</span>Background</button>
<button class="tool" id="mic"><span>🎙</span>Mic On</button>
</div>

<div class="panel" id="effectsPanel">
<h3>Face Tracking Effects</h3>
<div class="grid">
<button class="choice active" data-effect="none">Natural</button>
<button class="choice" data-effect="glasses">🕶 Glasses</button>
<button class="choice" data-effect="hearts">❤️ Hearts</button>
<button class="choice" data-effect="blush">🌸 Blush</button>
<button class="choice" data-effect="freckles">✨ Freckles</button>
<button class="choice" data-effect="stars">⭐ Stars</button>
</div>
<p id="faceStatus">Face tracking is loading...</p>
<button class="action" id="closeEffects">Done</button>
</div>

<div class="panel" id="filterPanel">
<h3>Filters</h3>
<div class="grid">
<button class="choice active" data-filter="none">Original</button>
<button class="choice" data-filter="warm">Warm</button>
<button class="choice" data-filter="cool">Cool</button>
<button class="choice" data-filter="bw">B&W</button>
<button class="choice" data-filter="pink">Pink</button>
<button class="choice" data-filter="bright">Bright</button>
</div>
<button class="action" id="closeFilters">Done</button>
</div>

<div class="panel" id="musicPanel">
<h3>♫ Add Music</h3>
<p id="musicName">No music selected.</p>
<input type="file" id="musicFile" accept="audio/*">
<button class="action" id="chooseMusic">Choose music from phone</button>
<label>Music volume</label>
<input type="range" id="volume" min="0" max="100" value="50">
<button class="action" id="closeMusic">Done</button>
</div>

<div class="bottom">
<div class="modes">
<button class="mode active" data-length="15">15s</button>
<button class="mode" data-length="60">60s</button>
<button class="mode" data-length="180">3m</button>
<button class="mode" data-length="photo">Photo</button>
</div>
<div class="capture">
<button id="upload">🖼 Upload</button>
<button id="record"></button>
<button id="openCam">📷 Camera</button>
</div>
<p id="status">Open your camera to begin.</p>
</div>

<div id="result">
<h2 style="color:#48d6c5">Your creation ❤️</h2>
<video id="resultVideo" controls playsinline></video>
<img id="resultImage" style="display:none" alt="Your photo">
<button class="resultBtn" id="download">Download</button>
<button class="resultBtn secondary" id="retake">Retake</button>
<button class="resultBtn secondary" id="backResult">Back to camera</button>
</div>

<input type="file" id="uploadFile" accept="image/*,video/*" style="display:none">
</div>

<audio id="music" loop></audio>

<script type="module">
import {
 FilesetResolver,
 FaceLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

const cam=document.getElementById("cam");
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const faceStatus=document.getElementById("faceStatus");
const music=document.getElementById("music");

let stream=null;
let landmarker=null;
let facePoints=null;
let facing="user";
let effect="none";
let filter="none";
let beautyOn=false;
let micOn=true;
let timerSeconds=0;
let length=15;
let mode="video";
let recording=false;
let recorder=null;
let chunks=[];
let videoURL=null;
let imageURL=null;
let musicURL=null;
let animationId=null;
let lastDetection=0;
let audioContext=null;
let audioDestination=null;
let musicGain=null;
let musicSource=null;
let micSource=null;
let recordStream=null;
let detectionBusy=false;

const filters={
 none:"none",
 warm:"sepia(.25) saturate(1.3)",
 cool:"hue-rotate(12deg)",
 bw:"grayscale(1)",
 pink:"sepia(.15) hue-rotate(300deg) saturate(1.3)",
 bright:"brightness(1.2) saturate(1.15)"
};

function say(message){status.textContent=message}

async function loadFaceTracking(){
 try{
  faceStatus.textContent="Loading face tracking model...";
  const vision=await FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
  );

  const modelURL=
   "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

  landmarker=await FaceLandmarker.createFromOptions(vision,{
   baseOptions:{
    modelAssetPath:modelURL,
    delegate:"GPU"
   },
   runningMode:"VIDEO",
   numFaces:1,
   outputFaceBlendshapes:true
  });

  faceStatus.textContent="Face tracking ready! Move your face to test.";
 }catch(error){
  faceStatus.textContent="Face tracking could not load. Check internet and reload.";
  console.error(error);
 }
}

async function openCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error("Please open PENIBON using Chrome.");
  }
  if(recording)return;

  if(stream)stream.getTracks().forEach(t=>t.stop());

  stream=await navigator.mediaDevices.getUserMedia({
   audio:true,
   video:{
    facingMode:{ideal:facing},
    width:{ideal:720},
    height:{ideal:1280}
   }
  });

  cam.srcObject=stream;
  await cam.play();
  stream.getAudioTracks().forEach(t=>t.enabled=micOn);
  say("Camera ready. Choose an effect!");
  if(!animationId)drawFrame();
 }catch(error){
  say("Camera error: "+error.message);
 }
}

function point(index){
 if(!facePoints||!facePoints[index])return null;
 const p=facePoints[index];
 let x=p.x*canvas.width;
 if(facing==="user")x=canvas.width-x;
 return {x,y:p.y*canvas.height};
}

function drawFaceEffect(){
 if(!facePoints)return;

 const leftEye=point(33);
 const rightEye=point(263);
 const nose=point(1);
 const leftCheek=point(205);
 const rightCheek=point(425);

 if(!leftEye||!rightEye||!nose)return;

 const eyeDistance=Math.hypot(
  rightEye.x-leftEye.x,
  rightEye.y-leftEye.y
 );

 ctx.save();
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 if(effect==="glasses"){
  const size=eyeDistance*.9;
  ctx.font=size+"px Arial";
  ctx.fillText("🕶️",(leftEye.x+rightEye.x)/2,
   (leftEye.y+rightEye.y)/2);
 }

 if(effect==="hearts"){
  ctx.font=(eyeDistance*.45)+"px Arial";
  ctx.fillText("❤️",nose.x,nose.y-eyeDistance*1.5);
  ctx.fillText("💕",nose.x-eyeDistance,nose.y);
 }

 if(effect==="stars"){
  ctx.font=(eyeDistance*.4)+"px Arial";
  ctx.fillText("✨",leftEye.x-eyeDistance*.3,leftEye.y);
  ctx.fillText("✨",rightEye.x+eyeDistance*.3,rightEye.y);
  ctx.fillText("⭐",nose.x,nose.y-eyeDistance);
 }

 if(effect==="blush"&&leftCheek&&rightCheek){
  ctx.fillStyle="rgba(255,75,135,.35)";
  [leftCheek,rightCheek].forEach(p=>{
   ctx.beginPath();
   ctx.ellipse(p.x,p.y,eyeDistance*.24,
    eyeDistance*.13,0,0,Math.PI*2);
   ctx.fill();
  });
 }

 if(effect==="freckles"&&leftCheek&&rightCheek){
  ctx.fillStyle="#9a6045";
  for(let side of [leftCheek,rightCheek]){
   for(let i=0;i<7;i++){
    ctx.beginPath();
    ctx.arc(
     side.x+(Math.random()-.5)*eyeDistance*.35,
     side.y+(Math.random()-.5)*eyeDistance*.2,
     2.5,0,Math.PI*2
    );
    ctx.fill();
   }
  }
 }

 ctx.restore();
}

function drawFrame(){
 if(cam.readyState>=2&&cam.videoWidth){
  const w=canvas.width,h=canvas.height;
  const scale=Math.max(w/cam.videoWidth,h/cam.videoHeight);
  const dw=cam.videoWidth*scale,dh=cam.videoHeight*scale;
  const x=(w-dw)/2,y=(h-dh)/2;

  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.filter=filters[filter]||"none";

  if(facing==="user"){
   ctx.translate(w,0);
   ctx.scale(-1,1);
  }
  ctx.drawImage(cam,x,y,dw,dh);
  ctx.restore();

  if(beautyOn){
   ctx.fillStyle="rgba(255,190,205,.09)";
   ctx.fillRect(0,0,w,h);
  }

  if(landmarker&&!detectionBusy&&cam.currentTime!==lastDetection){
   detectionBusy=true;
   lastDetection=cam.currentTime;
   try{
    const result=landmarker.detectForVideo(cam,performance.now());
    facePoints=result.faceLandmarks?.[0]||null;
    faceStatus.textContent=facePoints?
     "Face detected ✓":"Move into camera view to detect your face.";
   }catch(error){
    console.error(error);
   }finally{
    detectionBusy=false;
   }
  }

  drawFaceEffect();
 }
 animationId=requestAnimationFrame(drawFrame);
}

function showPanel(id){
 document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
 document.getElementById(id).style.display="block";
}

document.getElementById("openCam").onclick=openCamera;
document.getElementById("flip").onclick=async()=>{
 if(recording)return;
 facing=facing==="user"?"environment":"user";
 await openCamera();
};

document.getElementById("timer").onclick=()=>{
 timerSeconds=timerSeconds===0?3:timerSeconds===3?10:0;
 document.getElementById("timer").innerHTML=
  "<span>⏱</span>Timer "+(timerSeconds||"Off");
};

document.getElementById("filterBtn").onclick=()=>showPanel("filterPanel");
document.getElementById("effectBtn").onclick=()=>showPanel("effectsPanel");
document.getElementById("soundBtn").onclick=()=>showPanel("musicPanel");

document.getElementById("closeEffects").onclick=()=>showPanel("");
document.getElementById("closeFilters").onclick=()=>showPanel("");
document.getElementById("closeMusic").onclick=()=>showPanel("");

document.querySelectorAll("[data-effect]").forEach(button=>{
 button.onclick=()=>{
  effect=button.dataset.effect;
  document.querySelectorAll("[data-effect]").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  say("Effect selected: "+effect);
 };
});

document.querySelectorAll("[data-filter]").forEach(button=>{
 button.onclick=()=>{
  filter=button.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  say("Filter selected: "+filter);
 };
});

document.getElementById("beauty").onclick=()=>{
 beautyOn=!beautyOn;
 document.getElementById("beauty").classList.toggle("active",beautyOn);
 say(beautyOn?"Beauty preview enabled.":"Beauty preview disabled.");
};

document.getElementById("green").onclick=()=>{
 say("Advanced background replacement is planned for the next upgrade.");
};

document.getElementById("mic").onclick=()=>{
 micOn=!micOn;
 if(stream)stream.getAudioTracks().forEach(t=>t.enabled=micOn);
 document.getElementById("mic").innerHTML=
  "<span>🎙</span>Mic "+(micOn?"On":"Off");
};

document.getElementById("musicFile").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(musicURL)URL.revokeObjectURL(musicURL);
 musicURL=URL.createObjectURL(file);
 music.src=musicURL;
 document.getElementById("musicName").textContent=file.name;
};

document.getElementById("chooseMusic").onclick=()=>{
 document.getElementById("musicFile").click();
};

document.getElementById("volume").oninput=e=>{
 if(musicGain)musicGain.gain.value=Number(e.target.value)/100;
};

document.querySelectorAll("[data-length]").forEach(button=>{
 button.onclick=()=>{
  document.querySelectorAll("[data-length]").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  if(button.dataset.length==="photo"){
   mode="photo";
  }else{
   mode="video";
   length=Number(button.dataset.length);
  }
  say(mode==="photo"?"Photo mode selected.":"Video length: "+length+" seconds.");
 };
});

async function prepareAudio(){
 if(!audioContext){
  audioContext=new AudioContext();
  audioDestination=audioContext.createMediaStreamDestination();
  musicGain=audioContext.createGain();
  musicGain.connect(audioDestination);
  musicSource=audioContext.createMediaElementSource(music);
  musicSource.connect(musicGain);
 }
 if(audioContext.state==="suspended")await audioContext.resume();

 musicGain.gain.value=Number(document.getElementById("volume").value)/100;

 if(micSource){micSource.disconnect();micSource=null;}

 if(micOn&&stream.getAudioTracks().length){
  micSource=audioContext.createMediaStreamSource(
   new MediaStream(stream.getAudioTracks())
  );
  micSource.connect(audioDestination);
 }
 return audioDestination.stream;
}

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

async function countdown(){
 for(let i=timerSeconds;i>0;i--){
  say("Recording starts in "+i+"...");
  await sleep(1000);
 }
}

async function startRecording(){
 if(!stream){await openCamera();if(!stream)return;}
 if(recording)return;

 await countdown();

 try{
  const audio=await prepareAudio();
  recordStream=canvas.captureStream(30);
  audio.getAudioTracks().forEach(t=>recordStream.addTrack(t));

  chunks=[];
  const types=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  const type=types.find(t=>MediaRecorder.isTypeSupported(t));
  recorder=type?new MediaRecorder(recordStream,{mimeType:type}):new MediaRecorder(recordStream);

  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:recorder.mimeType||"video/webm"});
   if(videoURL)URL.revokeObjectURL(videoURL);
   videoURL=URL.createObjectURL(blob);
   document.getElementById("resultVideo").src=videoURL;
   document.getElementById("resultVideo").style.display="block";
   document.getElementById("resultImage").style.display="none";
   document.getElementById("result").style.display="block";
   music.pause();
   recordStream?.getTracks().forEach(t=>t.stop());
   recordStream=null;
   if(micSource){micSource.disconnect();micSource=null;}
  };

  recorder.start();
  recording=true;
  if(musicURL)await music.play().catch(()=>{});
  document.getElementById("record").classList.add("recording");
  say("🔴 Recording...");

  setTimeout(()=>{
   if(recording)stopRecording();
  },length*1000);

 }catch(error){
  say("Recording error: "+error.message);
 }
}

function stopRecording(){
 if(recorder&&recorder.state==="recording")recorder.stop();
 recording=false;
 music.pause();
 document.getElementById("record").classList.remove("recording");
 say("Recording complete!");
}

document.getElementById("record").onclick=async()=>{
 if(recording){stopRecording();return;}

 if(mode==="photo"){
  if(!stream){await openCamera();if(!stream)return;}
  await countdown();
  canvas.toBlob(blob=>{
   if(!blob)return;
   if(imageURL)URL.revokeObjectURL(imageURL);
   imageURL=URL.createObjectURL(blob);
   document.getElementById("resultImage").src=imageURL;
   document.getElementById("resultImage").style.display="block";
   document.getElementById("resultVideo").style.display="none";
   document.getElementById("result").style.display="block";
  },"image/jpeg",.92);
 }else{
  await startRecording();
 }
};

document.getElementById("download").onclick=()=>{
 const link=document.createElement("a");
 if(document.getElementById("resultVideo").style.display!=="none"&&videoURL){
  link.href=videoURL;link.download="PENIBON-video.webm";
 }else if(imageURL){
  link.href=imageURL;link.download="PENIBON-photo.jpg";
 }else return;
 link.click();
};

document.getElementById("retake").onclick=()=>{
 document.getElementById("resultVideo").pause();
 document.getElementById("result").style.display="none";
 if(videoURL)URL.revokeObjectURL(videoURL);
 if(imageURL)URL.revokeObjectURL(imageURL);
 videoURL=null;imageURL=null;
 say("Ready to create again!");
};

document.getElementById("backResult").onclick=()=>{
 document.getElementById("resultVideo").pause();
 document.getElementById("result").style.display="none";
};

document.getElementById("upload").onclick=()=>{
 document.getElementById("uploadFile").click();
};

document.getElementById("uploadFile").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 if(file.type.startsWith("video/")){
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file);
  document.getElementById("resultVideo").src=videoURL;
  document.getElementById("resultVideo").style.display="block";
  document.getElementById("resultImage").style.display="none";
 }else if(file.type.startsWith("image/")){
  if(imageURL)URL.revokeObjectURL(imageURL);
  imageURL=URL.createObjectURL(file);
  document.getElementById("resultImage").src=imageURL;
  document.getElementById("resultImage").style.display="block";
  document.getElementById("resultVideo").style.display="none";
 }else{
  say("Choose an image or video.");
  return;
 }
 document.getElementById("result").style.display="block";
};

window.leave=function(){
 if(recording)stopRecording();
 if(stream)stream.getTracks().forEach(t=>t.stop());
 location.href="dashboard.html";
};

loadFaceTracking();
</script>
</body>
</html>
